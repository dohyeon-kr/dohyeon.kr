server {
    listen 80;
    listen [::]:80;
    listen 192.168.219.101:80;

    server_name blog.dohyeon.kr dohyeon.kr;

    return 301 https://blog.dohyeon.kr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 192.168.219.101:443 ssl;

    server_name dohyeon.kr;

    ssl_certificate /etc/letsencrypt/live/dohyeon-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dohyeon-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://blog.dohyeon.kr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 192.168.219.101:443 ssl;

    server_name blog.dohyeon.kr;

    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/dohyeon-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dohyeon-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/visit {
        limit_except GET POST {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:2370;
    }

    location ^~ /api/visit/post/ {
        limit_except GET POST {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:2370;
    }

    location ^~ /api/comments/ {
        limit_except GET POST DELETE {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:2370;
    }

    location = /ghost/comments-admin/ {
        alias /var/www/ghost-blog/themes/monoliquid/assets/comments-admin.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ^~ /ghost/api/comments-admin {
        limit_except GET DELETE {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:2370;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://127.0.0.1:2368;
    }
}
