name: Temporary organic blob morph patch

on:
  push:
    branches:
      - feat/organic-blob-morph
    paths:
      - .github/workflows/tmp-organic-blob-morph.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/organic-blob-morph
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 shorts/scripts/tmp-organic-blob-patch.py
      - name: Validate
        working-directory: shorts
        run: |
          npm install
          npm test
          npm run typecheck
      - name: Commit result and remove temporary files
        run: |
          rm .github/workflows/tmp-organic-blob-morph.yml shorts/scripts/tmp-organic-blob-patch.py
          git config user.name "Dohyeon Ju"
          git config user.email "48502765+dohyeon2@users.noreply.github.com"
          git add shorts .github/workflows/tmp-organic-blob-morph.yml
          git commit -m "feat(shorts): add organic blob morphing"
          git push origin feat/organic-blob-morph
