name: Project promo banner check

on:
  push:
    paths:
      - 'themes/monoliquid/**'
      - 'scripts/test-project-promo-banner.py'
      - '.github/workflows/project-promo-banner-check.yml'
  pull_request:
    paths:
      - 'themes/monoliquid/**'
      - 'scripts/test-project-promo-banner.py'
      - '.github/workflows/project-promo-banner-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project promo banner contract
        run: python scripts/test-project-promo-banner.py
