name: Shorts pipeline check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'shorts/**'
      - '.github/workflows/*shorts*.yml'
  workflow_dispatch:
    inputs:
      generate_previews:
        description: Generate preview images and videos (otherwise validation only)
        type: boolean
        default: false
      manifest:
        description: Optional candidate path under shorts/content/ for silent preview
        type: string
        required: false

env:
  SHORTS_IMAGE_GENERATION: disabled
  HYPERFRAMES_VERSION: '0.8.40'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: shorts
        run: npm run typecheck
      - name: Fast unit tests
        working-directory: shorts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'video-background.test.mjs' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
      - name: Prepare media tools for integration tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Video media integration test
        working-directory: shorts
        run: node --test tests/video-background.test.mjs

  hyperframes-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund
      - name: Build deterministic Monoliquid v2 fixture
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shorts/content/__hyperframes-ci__
          cat > shorts/content/__hyperframes-ci__/candidate.json <<'JSON'
          {
            "schemaVersion": 3,
            "id": "hyperframes-ci",
            "status": "candidate",
            "source": {"url": "https://blog.dohyeon.kr/", "title": "DLOG"},
            "candidate": {
              "angle": "question",
              "hook": "검증 가능한 템플릿인가?",
              "title": "Monoliquid v2 CI",
              "rationale": "HyperFrames contract fixture",
              "viralScore": 0,
              "suggestedCaption": "",
              "hashtags": []
            },
            "style": {
              "theme": "monoliquid-v2",
              "template": "monoliquid-v2",
              "subtitles": "burned-in",
              "safeArea": "shorts-reels"
            },
            "scenes": [
              {
                "kind": "statement",
                "layout": "statement-offset",
                "headline": "HTML이 영상의 원본이다",
                "subline": "candidate JSON은 그대로 유지한다",
                "narration": "후보 데이터는 유지하고 렌더링만 HyperFrames로 바꿉니다.",
                "imageQuery": null,
                "comparisonLeft": null,
                "comparisonRight": null,
                "image": null,
                "visual": {"type": "none", "motif": null, "query": null, "value": null, "xLabel": null, "yLabel": null}
              }
            ]
          }
          JSON
          node shorts/scripts/build-hyperframes.mjs shorts/content/__hyperframes-ci__/candidate.json
      - name: HyperFrames lint and visual check
        env:
          PROJECT_DIR: ${{ steps.build.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npx --yes "hyperframes@${HYPERFRAMES_VERSION}" lint --verbose
          npx --yes "hyperframes@${HYPERFRAMES_VERSION}" check --strict --json | tee check.json

  presenter-rig-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund
      - name: Render programmable presenter
        working-directory: shorts
        run: |
          npm run typecheck
          node --test tests/presenter.test.mjs tests/presenter-api.test.mjs tests/presenter-visual.test.mjs
          mkdir -p public/fonts
          cp ../scripts/thumbnail-fonts/Pretendard-Bold.woff ../scripts/thumbnail-fonts/Pretendard-Regular.woff public/fonts/
          mkdir -p "${RUNNER_TEMP}/presenter-rig"
          for composition in PresenterRigPreview; do
            for frame in 0 30 60 90 120 150 180 210 240 270 300 330; do
              npx remotion still src/index.tsx "$composition" "${RUNNER_TEMP}/presenter-rig/${composition}-${frame}.png" --frame="$frame"
            done
          done
          npx remotion still src/index.tsx PresenterCases "${RUNNER_TEMP}/presenter-rig/presenter-cases.png"
          for composition in PresenterCandidatePreview DarkPresenterCandidatePreview; do
            for frame in 6 45 150 300; do
              npx remotion still src/index.tsx "$composition" "${RUNNER_TEMP}/presenter-rig/${composition}-${frame}.png" --frame="$frame"
            done
          done
          npx remotion render src/index.tsx PresenterRigPreview "${RUNNER_TEMP}/presenter-rig/presenter-rig.mp4" --concurrency=2
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: presenter-rig-${{ github.run_id }}
          path: ${{ runner.temp }}/presenter-rig/*
          retention-days: 7
  blog-cta-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund
      - name: Render common CTA review images
        run: |
          mkdir -p shorts/public/fonts "${RUNNER_TEMP}/blog-cta"
          cp scripts/thumbnail-fonts/Pretendard-Bold.woff scripts/thumbnail-fonts/Pretendard-Regular.woff shorts/public/fonts/
          cd shorts
          for composition in BlogCtaPreview DarkBlogCtaPreview; do
            for frame in 1 45 179; do
              npx remotion still src/index.tsx "$composition" "${RUNNER_TEMP}/blog-cta/${composition}-${frame}.png" --public-dir=public --frame="$frame"
            done
          done
          for frame in 81 90 99; do
            npx remotion still src/index.tsx BlogCtaTransitionPreview "${RUNNER_TEMP}/blog-cta/transition-${frame}.png" --public-dir=public --frame="$frame"
          done
          npx remotion render src/index.tsx BlogCtaTransitionPreview "${RUNNER_TEMP}/blog-cta/transition.mp4" --public-dir=public --concurrency=2
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: blog-cta-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/blog-cta/*
          retention-days: 7

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_previews
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Install shorts dependencies
        run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund

      - name: Prepare audio tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Prepare preview fonts
        run: |
          mkdir -p shorts/public/fonts
          cp scripts/thumbnail-fonts/Pretendard-Bold.woff shorts/public/fonts/
          cp scripts/thumbnail-fonts/Pretendard-Regular.woff shorts/public/fonts/

      - name: Render template preview frames
        # Explicitly requested visual QA; PR validation does not render previews.
        working-directory: shorts
        run: |
          mkdir -p "${RUNNER_TEMP}/shorts-template-preview"
          npm run typecheck
          npm test
          for composition in DiagramPreview MotionCanvasPreview PhysicsPreview CanvasFallbackPreview PhysicsFallbackPreview; do
            for frame in 0 60 119; do
              npx remotion still src/index.tsx "$composition" "${RUNNER_TEMP}/shorts-template-preview/${composition}-${frame}.png" --public-dir=public --frame="$frame"
            done
          done
          npx remotion render src/index.tsx PhysicsPreview "${RUNNER_TEMP}/shorts-template-preview/physics.mp4" --public-dir=public --concurrency=2
          npx remotion still src/index.tsx TemplatePreview "${RUNNER_TEMP}/shorts-template-preview/01-cover.png" --public-dir=public --frame=30
          npx remotion still src/index.tsx TemplatePreview "${RUNNER_TEMP}/shorts-template-preview/02-chart.png" --public-dir=public --frame=145
          npx remotion still src/index.tsx TemplatePreview "${RUNNER_TEMP}/shorts-template-preview/03-flow.png" --public-dir=public --frame=260
          npx remotion still src/index.tsx TemplatePreview "${RUNNER_TEMP}/shorts-template-preview/04-type.png" --public-dir=public --frame=680
          node scripts/render-template-preview.mjs "${RUNNER_TEMP}/shorts-integrated-preview" --silent

      - name: Render video backgrounds
        working-directory: shorts
        run: node scripts/verify-video-render.mjs

      - name: Render transitions and light effects
        working-directory: shorts
        run: node scripts/verify-motion-render.mjs

      - name: Upload template preview frames
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: shorts-template-preview-${{ github.run_id }}
          path: |
            shorts/out/video-background/**
            shorts/out/motion-effects/*.png
            shorts/out/motion-effects/*.mp4
            shorts/out/motion-effects/samples.json
            ${{ runner.temp }}/shorts-template-preview/*.png
            ${{ runner.temp }}/shorts-template-preview/*.mp4
            ${{ runner.temp }}/shorts-integrated-preview/*.png
            ${{ runner.temp }}/shorts-integrated-preview/*.mp4
            ${{ runner.temp }}/shorts-integrated-preview/SCRIPT.txt
            ${{ runner.temp }}/shorts-integrated-preview/*-BGM.md
          retention-days: 7
          if-no-files-found: ignore
