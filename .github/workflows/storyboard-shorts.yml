name: Build blog shorts storyboard

on:
  workflow_dispatch:
    inputs:
      generate_previews:
        description: Update the single working storyboard preview release
        type: boolean
        default: false
      engine:
        description: Storyboard render engine
        required: true
        default: remotion
        type: choice
        options:
          - remotion
          - hyperframes
      preview_scale:
        description: 'Preview scale: 0.5 = 540x960, 0.4 = 432x768, 0.25 = 270x480, 1 = 1080x1920'
        type: choice
        default: '0.5'
        options:
          - '0.5'
          - '0.4'
          - '0.25'
          - '1'
      manifest:
        description: Candidate JSON path under shorts/content/
        required: true
        type: string

env:
  SHORTS_IMAGE_GENERATION: disabled
  SHORTS_PREVIEW_SCALE: ${{ inputs.preview_scale }}
  HYPERFRAMES_VERSION: '0.8.40'

permissions:
  contents: write
  pull-requests: write

# Storyboard and review workflows both replace the same working preview release.
concurrency:
  group: shorts-storyboard-preview
  cancel-in-progress: false

jobs:
  storyboard:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_previews
    runs-on: ubuntu-latest

    steps:
      - name: Install video and storyboard tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick img2pdf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Resolve manifest and engine
        id: manifests
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
          ENGINE: ${{ inputs.engine }}
        shell: bash
        run: |
          set -euo pipefail
          list_file="${RUNNER_TEMP}/shorts-manifests.txt"
          : > "${list_file}"

          if [[ ! "${MANIFEST_INPUT}" =~ ^shorts/content/[^/]+/[^/]+\.json$ ]]; then
            echo "manifest must be a JSON path directly under shorts/content/<post>/" >&2
            exit 1
          fi
          if [[ ! -f "${MANIFEST_INPUT}" ]]; then
            echo "manifest does not exist: ${MANIFEST_INPUT}" >&2
            exit 1
          fi

          template="$(jq -r '.style.template // .style.theme // ""' "${MANIFEST_INPUT}")"
          case "${ENGINE}" in
            remotion)
              if [[ "${template}" == "monoliquid-v2" || "${template}" == "aurora-explain" ]]; then
                echo "::error title=Engine/template mismatch::monoliquid-v2 and aurora-explain require engine=hyperframes."
                exit 1
              fi
              ;;
            hyperframes)
              if [[ "${template}" != "monoliquid-v2" && "${template}" != "aurora-explain" ]]; then
                echo "::error title=Engine/template mismatch::engine=hyperframes requires style.template=monoliquid-v2 or aurora-explain; received ${template:-<none>}."
                exit 1
              fi
              ;;
            *)
              echo "unsupported engine: ${ENGINE}" >&2
              exit 1
              ;;
          esac

          printf '%s\n' "${MANIFEST_INPUT}" > "${list_file}"
          printf 'list_file=%s\n' "${list_file}" >> "${GITHUB_OUTPUT}"
          printf 'template=%s\n' "${template}" >> "${GITHUB_OUTPUT}"

      - name: Install shorts dependencies
        run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund

      - name: Validate all storyboard scenes
        id: validate
        continue-on-error: true
        env:
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          report_file="${RUNNER_TEMP}/storyboard-validation.json"
          while IFS= read -r manifest; do
            [[ -n "${manifest}" ]] || continue
            echo "::group::Validate ${manifest}"
            node shorts/scripts/validate-storyboard.mjs "${manifest}" "--report=${report_file}" || status=1
            echo "::endgroup::"
          done < "${LIST_FILE}"
          printf 'validation_report=%s\n' "${report_file}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Render scene snapshots with Remotion
        id: render_remotion
        if: always() && inputs.engine == 'remotion'
        continue-on-error: true
        env:
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r manifest; do
            [[ -n "${manifest}" ]] || continue
            echo "::group::Render ${manifest}"
            node shorts/scripts/render.mjs "${manifest}" --storyboard || status=1
            echo "::endgroup::"
          done < "${LIST_FILE}"
          exit "${status}"

      - name: Compile candidate to HyperFrames HTML
        id: hyperframes_build
        if: always() && inputs.engine == 'hyperframes'
        continue-on-error: true
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
        run: node shorts/scripts/build-hyperframes.mjs "$MANIFEST_INPUT"

      - name: HyperFrames lint
        id: hyperframes_lint
        if: always() && inputs.engine == 'hyperframes' && steps.hyperframes_build.outcome == 'success'
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          npx --yes "hyperframes@${HYPERFRAMES_VERSION}" lint --verbose

      - name: HyperFrames visual check
        id: hyperframes_check
        if: always() && inputs.engine == 'hyperframes' && steps.hyperframes_build.outcome == 'success'
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
        shell: bash
        run: |
          set -uo pipefail
          cd "${PROJECT_DIR}"

          set +e
          npx --yes "hyperframes@${HYPERFRAMES_VERSION}" check --strict --json | tee check.json
          check_status=${PIPESTATUS[0]}
          set -e

          if (( check_status == 0 )); then
            exit 0
          fi

          if [[ ! -s check.json ]] || ! jq -e . check.json >/dev/null 2>&1; then
            echo "::error title=HyperFrames visual check failed::Strict check exited ${check_status} without valid JSON diagnostics."
            exit "${check_status}"
          fi

          error_count="$(jq '[.lint, .runtime, .layout, .motion, .contrast] | map(.errorCount // 0) | add // 0' check.json)"
          warning_count="$(jq '[.lint, .runtime, .layout, .motion, .contrast] | map(.warningCount // 0) | add // 0' check.json)"

          if (( error_count > 0 )); then
            echo "::error title=HyperFrames visual check failed::Strict check found ${error_count} error(s) and ${warning_count} warning(s)."
            exit "${check_status}"
          fi

          echo "::warning title=HyperFrames strict warnings::Strict check found ${warning_count} warning(s) and no errors; keeping the storyboard preview reviewable."

      - name: Batch-repair rejected Aurora strict findings
        id: strict_repair
        if: always() && steps.manifests.outputs.template == 'aurora-explain' && (steps.validate.outcome == 'failure' || steps.hyperframes_check.outcome == 'failure')
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTS_STRICT_REPAIR_MODEL: ${{ vars.SHORTS_STRICT_REPAIR_MODEL || 'gpt-4.1-mini' }}
          MANIFEST_INPUT: ${{ inputs.manifest }}
          VALIDATION_REPORT: ${{ steps.validate.outputs.validation_report }}
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          args=("${MANIFEST_INPUT}" "--validation=${VALIDATION_REPORT}" "--report=shorts/out/aurora-strict-repair.md")
          if [[ -n "${PROJECT_DIR:-}" && -f "${PROJECT_DIR}/check.json" ]]; then
            args+=("--hyperframes=${PROJECT_DIR}/check.json")
          fi
          node shorts/scripts/repair-strict-storyboard.mjs "${args[@]}"

      - name: Open Aurora strict improvement PR
        id: strict_repair_pr
        if: always() && steps.strict_repair.outcome == 'success' && steps.strict_repair.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: 'fix(shorts): batch-repair Aurora strict findings'
          branch: automation/aurora-strict-repair-${{ github.run_id }}
          delete-branch: true
          title: 'fix: batch-repair rejected Aurora storyboard'
          body-path: shorts/out/aurora-strict-repair.md
          add-paths: |
            shorts/content/**

      # Strict validation is diagnostic here so every finding can be collected before
      # the final hard failure. A rejected candidate is never published; Aurora repair
      # is proposed separately as a PR from the complete diagnostic batch.
      - name: Render draft HyperFrames motion preview
        id: hyperframes_render
        if: always() && inputs.engine == 'hyperframes' && steps.hyperframes_build.outcome == 'success'
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          npx --yes "hyperframes@${HYPERFRAMES_VERSION}" render --quality draft --fps 30 --output preview.mp4

      - name: Compact HyperFrames motion preview
        id: hyperframes_compact
        if: always() && inputs.engine == 'hyperframes' && steps.hyperframes_render.outcome == 'success'
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
          PREVIEW_SCALE: ${{ inputs.preview_scale }}
        shell: bash
        run: |
          set -euo pipefail
          case "${PREVIEW_SCALE}" in
            1) size='1080:1920' ;;
            0.5) size='540:960' ;;
            0.25) size='270:480' ;;
            *) size='432:768' ;;
          esac
          ffmpeg -y -v error -i "${PROJECT_DIR}/preview.mp4" \
            -vf "scale=${size}:flags=lanczos" -an -c:v libx264 -preset medium \
            -b:v 850k -maxrate 950k -bufsize 1900k -movflags +faststart \
            "${PROJECT_DIR}/preview-release.mp4"
          bytes="$(stat -c%s "${PROJECT_DIR}/preview-release.mp4")"
          if (( bytes > 10485760 )); then
            echo "::error title=Motion preview too large::compressed preview is ${bytes} bytes; keep working previews under 10 MiB"
            exit 1
          fi

      - name: Extract HyperFrames storyboard hero frames
        id: hyperframes_extract
        if: always() && inputs.engine == 'hyperframes' && steps.hyperframes_render.outcome == 'success'
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
          PREVIEW_SCALE: ${{ inputs.preview_scale }}
        run: node shorts/scripts/extract-hyperframes-storyboard.mjs "$PROJECT_DIR" "$PROJECT_DIR/preview.mp4" "--scale=$PREVIEW_SCALE"

      - name: Package mobile review sheets
        id: package
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d shorts/out/storyboards ]] && find shorts/out/storyboards -type f -name '*-scene-[0-9][0-9].png' -print -quit | grep -q .; then
            bash shorts/scripts/package-storyboard.sh shorts/out/storyboards
          else
            echo "No storyboard snapshots were produced; skipping packaging."
            {
              echo '### Storyboard packaging'
              echo
              echo 'No storyboard snapshots were produced, so packaging was skipped.'
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Replace working storyboard preview release
        id: publish
        if: always() && steps.validate.outcome == 'success' && steps.package.outcome == 'success' && ((inputs.engine == 'remotion' && steps.render_remotion.outcome == 'success') || (inputs.engine == 'hyperframes' && steps.hyperframes_check.outcome == 'success' && steps.hyperframes_extract.outcome == 'success'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node shorts/scripts/publish-storyboard.mjs "${LIST_FILE}" "${RUNNER_TEMP}/storyboard-release.md"

      - name: Attach HyperFrames motion preview to working release
        id: hyperframes_attach
        if: always() && inputs.engine == 'hyperframes' && steps.hyperframes_compact.outcome == 'success' && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
          PREFIX: ${{ steps.hyperframes_build.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${PROJECT_DIR}/preview-release.mp4" "${RUNNER_TEMP}/${PREFIX}-motion-preview.mp4"
          gh release upload shorts-storyboard-preview "${RUNNER_TEMP}/${PREFIX}-motion-preview.mp4" --clobber

      - name: Batch storyboard diagnostics
        if: always()
        env:
          ENGINE: ${{ inputs.engine }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          REMOTION_RENDER_OUTCOME: ${{ steps.render_remotion.outcome }}
          HYPERFRAMES_BUILD_OUTCOME: ${{ steps.hyperframes_build.outcome }}
          HYPERFRAMES_LINT_OUTCOME: ${{ steps.hyperframes_lint.outcome }}
          HYPERFRAMES_CHECK_OUTCOME: ${{ steps.hyperframes_check.outcome }}
          STRICT_REPAIR_OUTCOME: ${{ steps.strict_repair.outcome }}
          STRICT_REPAIR_PR_URL: ${{ steps.strict_repair_pr.outputs.pull-request-url }}
          HYPERFRAMES_RENDER_OUTCOME: ${{ steps.hyperframes_render.outcome }}
          HYPERFRAMES_COMPACT_OUTCOME: ${{ steps.hyperframes_compact.outcome }}
          HYPERFRAMES_EXTRACT_OUTCOME: ${{ steps.hyperframes_extract.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          HYPERFRAMES_ATTACH_OUTCOME: ${{ steps.hyperframes_attach.outcome }}
          PROJECT_DIR: ${{ steps.hyperframes_build.outputs.project_dir }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          report() {
            local label="$1"
            local outcome="$2"
            printf -- '- %s: `%s`\n' "$label" "${outcome:-skipped}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$outcome" == 'failure' ]]; then
              failed=1
            fi
          }

          {
            echo '### Storyboard batch diagnostics'
            echo
            echo "- engine: \`${ENGINE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          report 'validation' "$VALIDATE_OUTCOME"
          if [[ "$ENGINE" == 'remotion' ]]; then
            report 'Remotion storyboard render' "$REMOTION_RENDER_OUTCOME"
          else
            report 'HyperFrames compile' "$HYPERFRAMES_BUILD_OUTCOME"
            report 'HyperFrames lint' "$HYPERFRAMES_LINT_OUTCOME"
            report 'HyperFrames strict check' "$HYPERFRAMES_CHECK_OUTCOME"
            report 'Aurora strict batch repair' "$STRICT_REPAIR_OUTCOME"
            report 'HyperFrames draft render' "$HYPERFRAMES_RENDER_OUTCOME"
            report 'HyperFrames compact preview' "$HYPERFRAMES_COMPACT_OUTCOME"
            report 'HyperFrames frame extraction' "$HYPERFRAMES_EXTRACT_OUTCOME"
          fi
          report 'storyboard package' "$PACKAGE_OUTCOME"
          report 'working release publish' "$PUBLISH_OUTCOME"
          if [[ "$ENGINE" == 'hyperframes' ]]; then
            report 'motion preview attach' "$HYPERFRAMES_ATTACH_OUTCOME"
          fi

          if [[ -n "$STRICT_REPAIR_PR_URL" ]]; then
            printf -- '- Aurora strict improvement PR: %s\n' "$STRICT_REPAIR_PR_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$ENGINE" == 'hyperframes' && -n "$PROJECT_DIR" && -f "$PROJECT_DIR/check.json" ]]; then
            {
              echo
              echo '#### HyperFrames findings'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              [.lint.findings[], .runtime.findings[], .layout.findings[], .motion.findings[], .contrast.findings[]]
              | flatten
              | if length == 0 then ["- none"] else map("- [\(.severity // \"unknown\")] `\(.code // \"unknown\")`: \(.message // \"\")") end
              | .[]
            ' "$PROJECT_DIR/check.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

          if (( failed )); then
            echo
            echo 'One or more storyboard stages failed. All runnable diagnostic stages were attempted before this final failure.' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Storyboard failed after batch diagnostics::See the job summary for every stage outcome and collected findings."
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'All runnable storyboard stages completed without failures.' >> "$GITHUB_STEP_SUMMARY"
