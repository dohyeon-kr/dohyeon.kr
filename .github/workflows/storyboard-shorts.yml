name: Build blog shorts storyboard

on:
  workflow_dispatch:
    inputs:
      generate_previews:
        description: Update the single working storyboard preview release
        type: boolean
        default: false
      preview_scale:
        description: 'Preview scale: 0.5 = 540x960, 0.25 = 270x480, 1 = 1080x1920'
        type: choice
        default: '0.5'
        options: ['0.5', '0.25', '1']
      manifest:
        description: Candidate JSON path under shorts/content/
        required: true
        type: string

env:
  SHORTS_IMAGE_GENERATION: disabled
  SHORTS_PREVIEW_SCALE: ${{ inputs.preview_scale }}

permissions:
  contents: write

# Storyboard and review workflows both replace the same working preview release.
concurrency:
  group: shorts-storyboard-preview
  cancel-in-progress: false

jobs:
  storyboard:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_previews
    runs-on: ubuntu-latest

    steps:
      - name: Install video and storyboard tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick img2pdf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Resolve manifest
        id: manifests
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          list_file="${RUNNER_TEMP}/shorts-manifests.txt"
          : > "${list_file}"

          if [[ ! "${MANIFEST_INPUT}" =~ ^shorts/content/[^/]+/[^/]+\.json$ ]]; then
            echo "manifest must be a JSON path directly under shorts/content/<post>/" >&2
            exit 1
          fi
          if [[ ! -f "${MANIFEST_INPUT}" ]]; then
            echo "manifest does not exist: ${MANIFEST_INPUT}" >&2
            exit 1
          fi
          printf '%s\n' "${MANIFEST_INPUT}" > "${list_file}"
          printf 'list_file=%s\n' "${list_file}" >> "${GITHUB_OUTPUT}"

      - name: Install shorts dependencies
        run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund

      - name: Validate all storyboard scenes
        id: validate
        continue-on-error: true
        env:
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r manifest; do
            [[ -n "${manifest}" ]] || continue
            echo "::group::Validate ${manifest}"
            node shorts/scripts/validate-storyboard.mjs "${manifest}" || status=1
            echo "::endgroup::"
          done < "${LIST_FILE}"
          exit "${status}"

      - name: Render scene snapshots
        id: render
        continue-on-error: true
        env:
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r manifest; do
            [[ -n "${manifest}" ]] || continue
            echo "::group::Render ${manifest}"
            node shorts/scripts/render.mjs "${manifest}" --storyboard || status=1
            echo "::endgroup::"
          done < "${LIST_FILE}"
          exit "${status}"

      - name: Package mobile review sheets
        id: package
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d shorts/out/storyboards ]] && find shorts/out/storyboards -type f -name '*-scene-[0-9][0-9].png' -print -quit | grep -q .; then
            bash shorts/scripts/package-storyboard.sh shorts/out/storyboards
          else
            echo "No storyboard snapshots were produced; skipping packaging."
            {
              echo '### Storyboard packaging'
              echo
              echo 'No storyboard snapshots were produced, so packaging was skipped.'
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Replace working storyboard preview release
        if: steps.validate.outcome == 'success' && steps.render.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node shorts/scripts/publish-storyboard.mjs "${LIST_FILE}" "${RUNNER_TEMP}/storyboard-release.md"

      - name: Fail after collecting storyboard issues
        if: always() && (steps.validate.outcome == 'failure' || steps.render.outcome == 'failure' || steps.package.outcome == 'failure')
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        shell: bash
        run: |
          {
            echo '### Storyboard result'
            echo
            echo "- validation: ${VALIDATE_OUTCOME}"
            echo "- render: ${RENDER_OUTCOME}"
            echo "- package: ${PACKAGE_OUTCOME}"
            echo
            echo 'The job intentionally continued after intermediate failures so all available diagnostics could be collected. Fix the validation table above first, then re-run the workflow.'
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Storyboard failed after diagnostics::validation=${VALIDATE_OUTCOME}, render=${RENDER_OUTCOME}, package=${PACKAGE_OUTCOME}"
          exit 1
