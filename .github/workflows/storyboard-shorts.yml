name: Build blog shorts storyboard

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'shorts/content/**/*.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: Candidate JSON path under shorts/content/
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shorts-storyboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storyboard:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Resolve manifests
        id: manifests
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_INPUT: ${{ inputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          list_file="${RUNNER_TEMP}/shorts-manifests.txt"
          : > "${list_file}"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${MANIFEST_INPUT}" =~ ^shorts/content/[^/]+/[^/]+\.json$ ]]; then
              echo "manifest must be a JSON path directly under shorts/content/<post>/" >&2
              exit 1
            fi
            if [[ ! -f "${MANIFEST_INPUT}" ]]; then
              echo "manifest does not exist: ${MANIFEST_INPUT}" >&2
              exit 1
            fi
            printf '%s\n' "${MANIFEST_INPUT}" >> "${list_file}"
          else
            node shorts/scripts/candidate-selection.mjs
            exit 0
          fi

          sort -u "${list_file}" -o "${list_file}"
          cat "${list_file}"
          printf 'count=1\n' >> "${GITHUB_OUTPUT}"
          printf 'list_file=%s\n' "${list_file}" >> "${GITHUB_OUTPUT}"

      - name: Install shorts dependencies
        if: steps.manifests.outputs.count != '0'
        run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund

      - name: Install storyboard packaging tools
        if: steps.manifests.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick img2pdf

      - name: Render scene snapshots
        if: steps.manifests.outputs.count != '0'
        env:
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            [[ -n "${manifest}" ]] || continue
            [[ -f "${manifest}" ]] || continue
            node shorts/scripts/render.mjs "${manifest}" --storyboard
          done < "${LIST_FILE}"

      - name: Build mobile review sheets
        if: steps.manifests.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' storyboard_dir; do
            mapfile -d '' scenes < <(find "${storyboard_dir}" -maxdepth 1 -type f -name '*-scene-[0-9][0-9].png' -print0 | sort -z)
            [[ "${#scenes[@]}" -gt 0 ]] || continue
            base="$(basename "${storyboard_dir}")"
            montage "${scenes[@]}" \
              -thumbnail '540x960' \
              -tile 2x \
              -geometry +0+0 \
              -background '#050505' \
              -quality 90 \
              "${storyboard_dir}/${base}-contact-sheet.jpg"
            # One row per diagram: initial → change → result. Non-diagram scenes appear once.
            motion_frames=()
            for scene in "${scenes[@]}"; do
              stem="${scene%.png}"
              if [[ -f "${stem}-initial.png" ]]; then
                motion_frames+=("${stem}-initial.png" "${stem}-change.png" "${scene}")
              fi
            done
            if [[ "${#motion_frames[@]}" -gt 0 ]]; then
              montage "${motion_frames[@]}" -thumbnail '360x640' -tile 3x -geometry +8+8 -background '#050505' -quality 90 "${storyboard_dir}/${base}-motion-contact-sheet.jpg"
            fi
            img2pdf "${scenes[@]}" -o "${storyboard_dir}/${base}-storyboard.pdf"
          done < <(find shorts/out/storyboards -mindepth 1 -maxdepth 1 -type d -print0)

      - name: Publish draft release for mobile approval
        if: steps.manifests.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: shorts-storyboard-${{ github.run_id }}
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -euo pipefail
          node shorts/scripts/publish-storyboard.mjs "${LIST_FILE}" "${RUNNER_TEMP}/storyboard-release.md"
