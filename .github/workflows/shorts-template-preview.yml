name: Publish shorts template preview

on:
  push:
    branches:
      - main
    paths:
      - 'shorts/src/**'
      - 'shorts/package.json'
      - 'shorts/scripts/render-template-preview.mjs'
      - 'shorts/scripts/bgm.mjs'
      - '.github/workflows/shorts-template-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Install shorts dependencies
        run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund

      - name: Prepare preview fonts
        run: |
          mkdir -p shorts/public/fonts
          cp scripts/thumbnail-fonts/Pretendard-Bold.woff shorts/public/fonts/
          cp scripts/thumbnail-fonts/Pretendard-Regular.woff shorts/public/fonts/

      - name: Render public preview
        # Public previews use real TTS; PR checks explicitly use --silent.
        working-directory: shorts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTS_TTS_MODEL: ${{ vars.SHORTS_TTS_MODEL }}
          SHORTS_TTS_VOICE: ${{ vars.SHORTS_TTS_VOICE }}
          SHORTS_BGM_TRACK: ${{ vars.SHORTS_BGM_TRACK }}
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node scripts/render-template-preview.mjs "${RUNNER_TEMP}/shorts-template-preview"

      - name: Refresh public preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete shorts-template-preview --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create shorts-template-preview \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Shorts Template Preview" \
            --prerelease \
            --notes "Integrated DLOG preview: graph, seesaw physics, bottleneck and semantic captions. Includes AI-generated narration, per-scene PNGs and SCRIPT.txt. Conceptual example, not measured data. Updated from ${GITHUB_SHA}."
          gh release upload shorts-template-preview \
            "${RUNNER_TEMP}/shorts-template-preview/shorts-template-preview.mp4" \
            "${RUNNER_TEMP}/shorts-template-preview/shorts-template-preview.png" \
            "${RUNNER_TEMP}/shorts-template-preview/"scene-*.png \
            "${RUNNER_TEMP}/shorts-template-preview/SCRIPT.txt" \
            "${RUNNER_TEMP}/shorts-template-preview/"*-BGM.md \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
