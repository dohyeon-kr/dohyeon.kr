name: Diagnose Ghost theme paths
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-theme.yml]
permissions: {}
jobs:
  inspect:
    runs-on: self-hosted
    permissions: {}
    steps:
      - name: Read deployed theme paths without privilege
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('/var/www/ghost-blog')
          for base in (root / 'themes', root / 'content/themes'):
              try:
                  print('Theme directories:', str(base), [p.name for p in base.iterdir() if p.is_dir()])
                  for path in base.glob('*/index.hbs'):
                      data = path.read_bytes()
                      print('Template:', str(path), 'sha256:', hashlib.sha256(data).hexdigest(), 'carousel:', b'featured-carousel' in data)
              except OSError as error:
                  print(type(error).__name__, str(base))
          wrapper = Path('/usr/local/sbin/deploy-ghost-blog')
          try:
              for number, line in enumerate(wrapper.read_text().splitlines(), 1):
                  if any(word in line for word in ('themes', 'rsync', 'cp ', 'install ', 'COMPOSE_FILE', 'DEPLOY_DIR')):
                      if not any(word in line.lower() for word in ('secret', 'password', 'token', 'age_key')):
                          print('Wrapper', number, line)
          except OSError as error:
              print(type(error).__name__, str(wrapper))
          PY
