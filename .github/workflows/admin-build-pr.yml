name: Build admin assets for PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'themes/monoliquid/**'
      - '.github/workflows/admin-build-pr.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Enable corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Test and build dashboard
        run: |
          pnpm --dir admin install --frozen-lockfile --ignore-scripts
          pnpm --dir admin test
          pnpm --dir admin build

      - name: Commit generated dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- themes/monoliquid/assets/dashboard; then
            echo 'Dashboard assets already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add themes/monoliquid/assets/dashboard
          git commit -m 'chore: refresh dashboard bundle [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
