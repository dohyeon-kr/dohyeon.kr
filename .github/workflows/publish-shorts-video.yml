name: Publish existing shorts video

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Render blog shorts run ID (9 = 33958707152, 10 = 33958742632)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: shorts-video-publish-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download existing rendered video
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID' >&2; exit 1; }
          run_info="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e '.conclusion == "success" and .path == ".github/workflows/render-shorts.yml"' <<< "${run_info}" >/dev/null
          source_sha="$(jq -r '.head_sha' <<< "${run_info}")"
          printf 'SOURCE_SHA=%s\n' "${source_sha}" >> "${GITHUB_ENV}"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "blog-shorts-${SOURCE_RUN_ID}" --dir shorts/out

      - name: Publish video release for mobile download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: bash shorts/scripts/publish-video-release.sh shorts/out
