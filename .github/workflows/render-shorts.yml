name: Render blog shorts

on:
  push:
    branches:
      - main
    paths:
      - 'shorts/content/**/*.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: Candidate JSON path under shorts/content/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shorts-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Install shorts dependencies
        run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Resolve manifests
        id: manifests
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST_INPUT: ${{ inputs.manifest }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          list_file="${RUNNER_TEMP}/shorts-manifests.txt"
          : > "${list_file}"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${MANIFEST_INPUT}" =~ ^shorts/content/[^/]+/[^/]+\.json$ ]]; then
              echo "manifest must be a JSON path directly under shorts/content/<post>/" >&2
              exit 1
            fi
            if [[ ! -f "${MANIFEST_INPUT}" ]]; then
              echo "manifest does not exist: ${MANIFEST_INPUT}" >&2
              exit 1
            fi
            printf '%s\n' "${MANIFEST_INPUT}" >> "${list_file}"
          else
            if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
              git diff-tree --no-commit-id --name-only --diff-filter=AMR -r "${CURRENT_SHA}" -- 'shorts/content/**/*.json' >> "${list_file}"
            else
              git diff --name-only --diff-filter=AMR "${BEFORE_SHA}" "${CURRENT_SHA}" -- 'shorts/content/**/*.json' >> "${list_file}"
            fi
          fi

          sort -u "${list_file}" -o "${list_file}"
          cat "${list_file}"
          printf 'list_file=%s\n' "${list_file}" >> "${GITHUB_OUTPUT}"

      - name: Render changed candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTS_TTS_MODEL: ${{ vars.SHORTS_TTS_MODEL }}
          SHORTS_TTS_VOICE: ${{ vars.SHORTS_TTS_VOICE }}
          SHORTS_PLAYBACK_RATE: 1.5
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            [[ -n "${manifest}" ]] || continue
            [[ -f "${manifest}" ]] || continue
            node shorts/scripts/render-reels.mjs "${manifest}"
          done < "${LIST_FILE}"

      - name: Upload rendered shorts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: blog-shorts-${{ github.run_id }}
          path: |
            shorts/out/*.mp4
            shorts/out/*.srt
            shorts/out/*-MEDIA.md
            shorts/out/*-REELS.txt
            shorts/out/*-SCRIPT.txt
          if-no-files-found: warn
          retention-days: 14
