name: Render blog shorts

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Candidate JSON path under shorts/content/
        required: true
        type: string
      storyboard_approved:
        description: I reviewed and approved every storyboard scene
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: shorts-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Install shorts dependencies
        run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund

      - name: Ensure audio tools are available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Resolve manifests
        id: manifests
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          list_file="${RUNNER_TEMP}/shorts-manifests.txt"
          : > "${list_file}"

          if [[ "${{ inputs.storyboard_approved }}" != "true" ]]; then
            echo "Final rendering requires explicit storyboard approval." >&2
            exit 1
          fi
          if [[ ! "${MANIFEST_INPUT}" =~ ^shorts/content/[^/]+/[^/]+\.json$ ]]; then
            echo "manifest must be a JSON path directly under shorts/content/<post>/" >&2
            exit 1
          fi
          if [[ ! -f "${MANIFEST_INPUT}" ]]; then
            echo "manifest does not exist: ${MANIFEST_INPUT}" >&2
            exit 1
          fi
          printf '%s\n' "${MANIFEST_INPUT}" >> "${list_file}"

          sort -u "${list_file}" -o "${list_file}"
          cat "${list_file}"
          printf 'list_file=%s\n' "${list_file}" >> "${GITHUB_OUTPUT}"

      - name: Render changed candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTS_TTS_MODEL: ${{ vars.SHORTS_TTS_MODEL }}
          SHORTS_TTS_VOICE: ${{ vars.SHORTS_TTS_VOICE }}
          SHORTS_TTS_RATE: 1.5
          SHORTS_BGM_TRACK: ${{ vars.SHORTS_BGM_TRACK }}
          LIST_FILE: ${{ steps.manifests.outputs.list_file }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            [[ -n "${manifest}" ]] || continue
            [[ -f "${manifest}" ]] || continue
            node shorts/scripts/render-reels.mjs "${manifest}"
          done < "${LIST_FILE}"

      - name: Upload rendered shorts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: blog-shorts-${{ github.run_id }}
          path: |
            shorts/out/*.mp4
            shorts/out/*.srt
            shorts/out/*-MEDIA.md
            shorts/out/*-BGM.md
            shorts/out/*-REELS.txt
            shorts/out/*-SCRIPT.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish video release for mobile download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash shorts/scripts/publish-video-release.sh shorts/out
