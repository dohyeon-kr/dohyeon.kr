name: Repair Aurora candidate safe areas

on:
  push:
    branches:
      - feat/aurora-explain-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/aurora-explain-runtime
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - name: Repair candidate geometry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'shorts/content/usecase-domain-repository-seolgyebuteo-dongsiseongggaji/candidate-01.json';
          const json = JSON.parse(fs.readFileSync(file, 'utf8'));
          const setX = (scene, id, x) => {
            const node = json.scenes[scene - 1].diagramSpec.nodes.find(node => node.id === id);
            if (!node) throw new Error(`missing scene ${scene} node ${id}`);
            node.x = x;
          };
          setX(1, 'browser', 120);
          setX(3, 'repository-read', 130);
          setX(3, 'usecase', 310);
          setX(3, 'domain', 490);
          setX(3, 'repository-write', 670);
          setX(4, 'repository', 620);
          setX(5, 'browser-a', 135);
          setX(5, 'browser-b', 135);
          setX(5, 'database', 660);
          setX(6, 'browser-a', 135);
          setX(6, 'browser-b', 135);
          setX(6, 'database', 660);
          if (json.scenes[7]?.visualIntent?.relation?.type === 'reframe') json.scenes[7].visualIntent.relation.type = 'flow';
          fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          NODE
      - name: Commit candidate repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shorts/content/usecase-domain-repository-seolgyebuteo-dongsiseongggaji/candidate-01.json
          git commit -m 'fix(shorts): keep Aurora candidate inside safe areas'
          git push origin HEAD:feat/aurora-explain-runtime
