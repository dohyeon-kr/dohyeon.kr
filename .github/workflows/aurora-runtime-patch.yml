name: Apply Aurora runtime routing patch

on:
  push:
    branches:
      - feat/aurora-explain-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/aurora-explain-runtime
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - name: Patch shared workflow routing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['.github/workflows/storyboard-shorts.yml', '.github/workflows/render-shorts.yml']) {
            let source = fs.readFileSync(file, 'utf8');
            const before = source;
            source = source.replace(
              'if [[ "${template}" == "monoliquid-v2" ]]; then',
              'if [[ "${template}" == "monoliquid-v2" || "${template}" == "aurora-explain" ]]; then',
            );
            source = source.replace(
              '::monoliquid-v2 requires engine=hyperframes.',
              '::monoliquid-v2 and aurora-explain require engine=hyperframes.',
            );
            source = source.replace(
              'if [[ "${template}" != "monoliquid-v2" ]]; then',
              'if [[ "${template}" != "monoliquid-v2" && "${template}" != "aurora-explain" ]]; then',
            );
            source = source.replace(
              'engine=hyperframes currently requires style.template=monoliquid-v2; received',
              'engine=hyperframes requires style.template=monoliquid-v2 or aurora-explain; received',
            );
            if (source === before) throw new Error(`No engine guard replacements applied to ${file}`);
            fs.writeFileSync(file, source);
          }

          const generate = '.github/workflows/generate-shorts.yml';
          let source = fs.readFileSync(generate, 'utf8');
          if (!source.includes("          - 'aurora-explain'")) {
            source = source.replace("          - 'monoliquid-v2'\n          - 'notebook-grid'", "          - 'monoliquid-v2'\n          - 'aurora-explain'\n          - 'notebook-grid'");
          }
          if (!source.includes("          - 'aurora-explain'")) throw new Error('Failed to expose aurora-explain in Generate blog shorts');
          fs.writeFileSync(generate, source);

          fs.rmSync('.github/workflows/aurora-runtime-patch.yml');
          NODE
      - name: Commit routing patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/storyboard-shorts.yml .github/workflows/render-shorts.yml .github/workflows/generate-shorts.yml .github/workflows/aurora-runtime-patch.yml
          git commit -m 'feat(shorts): route Aurora through shared workflows'
          git push origin HEAD:feat/aurora-explain-runtime
