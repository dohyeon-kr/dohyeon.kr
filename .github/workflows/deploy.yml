name: Release & Deploy Ghost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.GHOST_PRODUCTION_MYSQL_READY == 'true'
    permissions:
      contents: write
    outputs:
      deploy_sha: ${{ steps.deploy-revision.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0

      - name: Enable corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test deployment safeguards
        run: ./scripts/check-deploy-workflow.sh

      - name: Test visitor counter
        run: python3 -m unittest discover -s services/visit-counter -p 'test_*.py' -v

      - name: Verify generated thumbnails
        run: pnpm thumbnails:check

      - name: Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release

      - name: Resolve deployed main revision
        id: deploy-revision
        shell: bash
        run: |
          set -euo pipefail
          remote_line="$(git ls-remote --exit-code origin refs/heads/main)"
          deploy_sha="${remote_line%%$'\t'*}"
          [[ "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${deploy_sha}" >> "${GITHUB_OUTPUT}"

  deploy:
    runs-on: self-hosted
    needs: release
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions: {}

    steps:
      - name: Deploy verified main revision
        env:
          DEPLOY_SHA: ${{ needs.release.outputs.deploy_sha }}
        run: sudo /usr/local/sbin/deploy-ghost-blog "$DEPLOY_SHA"
