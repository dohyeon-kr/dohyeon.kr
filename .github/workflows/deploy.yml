name: Release & Deploy Ghost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test deployment safeguards
        run: ./scripts/check-deploy-workflow.sh

      - name: Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release

  deploy:
    runs-on: self-hosted
    needs: release
    environment: production
    permissions: {}

    steps:
      - name: Deploy verified main revision
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: sudo /usr/local/sbin/deploy-ghost-blog "$DEPLOY_SHA"
