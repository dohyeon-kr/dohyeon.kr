name: Notebook template render check

on:
  pull_request:
    paths:
      - 'shorts/src/templates/**'
      - 'shorts/src/visuals/**'
      - 'shorts/public/templates/**'
      - 'shorts/scripts/verify-notebook-render.mjs'
      - 'shorts/scripts/verify-collaboration-layout.mjs'
      - '.github/workflows/shorts-notebook-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - run: npm --prefix shorts install --ignore-scripts --no-audit --no-fund
      - name: Check Korean text, photo print, diagrams, presenter and intermediate frames
        run: node shorts/scripts/verify-notebook-render.mjs --video
      - name: Check collaboration typography, diagrams and persistent presenter
        run: node shorts/scripts/verify-collaboration-layout.mjs --photos
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: notebook-template-preview
          path: |
            shorts/out/notebook-check/
            shorts/out/collaboration-layout/
          retention-days: 7
