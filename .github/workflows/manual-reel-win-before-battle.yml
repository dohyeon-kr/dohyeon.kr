name: Manual reel - Win Before Battle
on:
  push:
    branches:
      - reels/win-before-battle-20261111
    paths:
      - 'shorts/manual-reels/win-before-battle/**'
      - '.github/workflows/manual-reel-win-before-battle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shorts/manual-reels/win-before-battle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HyperFrames and Korean fonts
        run: |
          npm install --no-save --no-audit --no-fund hyperframes@0.9.31 gsap@3.14.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          mkdir -p assets output
          curl -fLSs --retry 3 'https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2' -o assets/PretendardVariable.woff2
      - name: Retrieve original Velvet Scholar narration
        run: |
          curl -fLSs --retry 3 'https://resource2.heygen.ai/text_to_speech/21194a54e6e9464ba166fcf9ec563045/9f774d1a93b84a26aa3da3cf5ddf6135/id=bfaa77c19ba146c28e0df87e22bd5537.wav' -o assets/narration.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/narration.wav
      - name: HyperFrames diagnostic
        continue-on-error: true
        run: |
          npx hyperframes lint > output/lint.txt 2>&1
          npx hyperframes check > output/check.txt 2>&1
          npx hyperframes snapshot --at 1.8,13.0,22.0,31.0,41.0 > output/snapshot.txt 2>&1
      - name: Render HyperFrames MP4
        run: |
          npx hyperframes render --output output/silent.mp4 --fps 30 --quality high --workers 2
          test -s output/silent.mp4
      - name: Mux original audio and create cover
        run: |
          ffmpeg -y -hide_banner -loglevel error -i output/silent.mp4 -i assets/narration.wav \
            -filter_complex "[1:a]aresample=48000,volume=0.95,apad=pad_dur=0.9[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -ar 48000 -t 43.8 -movflags +faststart \
            output/win-before-battle.mp4
          ffmpeg -y -hide_banner -loglevel error -ss 1.80 -i output/win-before-battle.mp4 -frames:v 1 output/cover.png
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,sample_rate,bit_rate,width,height -show_entries format=duration -of json output/win-before-battle.mp4 > output/ffprobe.json
          test -s output/cover.png
          test -s output/ffprobe.json
      - name: Upload reel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-before-battle-reel
          path: |
            shorts/manual-reels/win-before-battle/output/**
            shorts/manual-reels/win-before-battle/script.srt
            shorts/manual-reels/win-before-battle/instagram-caption.md
          retention-days: 21
