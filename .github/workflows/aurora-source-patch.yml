name: Patch Aurora source integration

on:
  push:
    branches:
      - feat/aurora-explain-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/aurora-explain-runtime
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
      - name: Patch intentional overflow and presenter-less audio prep
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const builder = 'shorts/scripts/build-hyperframes-aurora.mjs';
          let source = fs.readFileSync(builder, 'utf8');
          const ambientBefore = 'return `<div class="ax-ambient" aria-hidden="true"><i class="ax-orb ax-orb--a"></i><i class="ax-orb ax-orb--b"></i><i class="ax-orb ax-orb--c"></i></div>`;';
          const ambientAfter = 'return `<div class="ax-ambient" data-layout-allow-overflow aria-hidden="true"><i class="ax-orb ax-orb--a" data-layout-allow-overflow></i><i class="ax-orb ax-orb--b" data-layout-allow-overflow></i><i class="ax-orb ax-orb--c" data-layout-allow-overflow></i></div>`;';
          if (!source.includes(ambientBefore)) throw new Error('Aurora ambient markup contract changed');
          source = source.replace(ambientBefore, ambientAfter);
          if (!source.includes('<div class="ax-sweep"></div>')) throw new Error('Aurora CTA sweep contract changed');
          source = source.replace('<div class="ax-sweep"></div>', '<div class="ax-sweep" data-layout-allow-overflow></div>');
          fs.writeFileSync(builder, source);

          const render = 'shorts/scripts/render.mjs';
          source = fs.readFileSync(render, 'utf8');
          const renderBefore = `  const manifest = withBlogCta(JSON.parse(await fs.readFile(manifestPath, 'utf8')));\n  const hasScenePresenter = manifest.scenes.some((scene) => scene.presenter != null || scene.layout === 'presenter-bust');\n  if (manifest.presenterOverlay == null && !hasScenePresenter) manifest.presenterOverlay = {...DEFAULT_PRESENTER_OVERLAY};\n  if (manifest.scenes.some(s => s.uiMotion) && resolveTemplate(manifest).id !== 'notebook-grid') throw new Error('uiMotion requires notebook-grid');\n  resolveTemplate(manifest);`;
          const renderAfter = `  const manifest = withBlogCta(JSON.parse(await fs.readFile(manifestPath, 'utf8')));\n  const template = resolveTemplate(manifest);\n  const hasScenePresenter = manifest.scenes.some((scene) => scene.presenter != null || scene.layout === 'presenter-bust');\n  if (template.id === 'aurora-explain') {\n    manifest.presenterOverlay = null;\n    for (const scene of manifest.scenes) scene.presenter = null;\n  } else if (manifest.presenterOverlay == null && !hasScenePresenter) {\n    manifest.presenterOverlay = {...DEFAULT_PRESENTER_OVERLAY};\n  }\n  if (manifest.scenes.some(s => s.uiMotion) && template.id !== 'notebook-grid') throw new Error('uiMotion requires notebook-grid');`;
          if (!source.includes(renderBefore)) throw new Error('render.mjs presenter setup contract changed');
          source = source.replace(renderBefore, renderAfter);
          fs.writeFileSync(render, source);
          NODE
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shorts/scripts/build-hyperframes-aurora.mjs shorts/scripts/render.mjs
          git commit -m 'fix(shorts): finalize Aurora strict render path'
          git push origin HEAD:feat/aurora-explain-runtime
